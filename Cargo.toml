[package]
name = "shellyard"
version = "0.1.0-beta.1"
edition = "2021"
description = "Local, native SSH/SFTP/terminal manager with an encrypted vault"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SacerdosH3x/shellyard"
readme = "README.md"
keywords = ["ssh", "terminal", "sftp", "tunnel", "egui"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
anyhow = "1"
alacritty_terminal = "0.26"
portable-pty = "0.9"
egui-phosphor = "0.7"
zeroize = "1"
dirs = "5"
rfd = "0.15"

[profile.release]
lto = true
strip = true

# Argon2 and the terminal parser are very slow unoptimized; optimize deps in dev builds.
[profile.dev.package."*"]
opt-level = 2
