[package]
name = "shellyard"
version = "0.1.0-beta.3"
edition = "2021"
description = "Local, native SSH/SFTP/terminal manager with an encrypted vault"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SacerdosH3x/shellyard"
readme = "README.md"
keywords = ["ssh", "terminal", "sftp", "tunnel", "egui"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
anyhow = "1"
alacritty_terminal = "0.26"
portable-pty = "0.9"
egui-phosphor = "0.7"
zeroize = "1"
dirs = "5"
rfd = "0.15"
libc = "0.2"
# Built-in RDP client (IronRDP). No reqwest: Kerberos KDC lookups are not used; sign-in is NTLM.
ironrdp = { version = "0.17", default-features = false, features = ["core", "pdu", "connector", "session", "graphics", "input", "dvc", "displaycontrol"] }
ironrdp-tokio = "0.10"
ironrdp-tls = { version = "0.2", features = ["rustls-ring"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "io-util"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
sha2 = "0.10"
smallvec = "1"

[profile.release]
lto = true
strip = true

# Argon2 and the terminal parser are very slow unoptimized; optimize deps in dev builds.
[profile.dev.package."*"]
opt-level = 2
